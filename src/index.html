<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overworked</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- 像素打工仔本体 Canvas（120 高，给坐骑留下方空间） -->
    <canvas id="pet" width="120" height="140"></canvas>

    <!-- 特殊状态横幅（度假/离职/住院时显示，提示用户数值暂停） -->
    <div id="status-banner" hidden></div>

    <!-- 数值细条（红线2 调整后：常驻显示四属性） -->
    <div id="stats-panel">
      <div class="stat-row"><span class="stat-label">体力</span><div class="stat-bar"><div class="stat-fill" id="bar-stamina"></div></div></div>
      <div class="stat-row"><span class="stat-label">心情</span><div class="stat-bar"><div class="stat-fill" id="bar-mood"></div></div></div>
      <div class="stat-row"><span class="stat-label">存款</span><span class="stat-num" id="num-savings">0</span></div>
      <div class="stat-row"><span class="stat-label">时薪</span><span class="stat-num" id="num-wage">0</span></div>
    </div>

    <!-- 修仙面板（修仙模式放开红线：境界/修为/体力/心情可见） -->
    <div id="cult-panel" hidden>
      <div class="stat-row cult-row">
        <span class="stat-label cult-label">境界</span>
        <span class="stat-num cult-realm" id="cult-realm">凡人</span>
      </div>
      <div class="stat-row cult-row">
        <span class="stat-label cult-label">修为</span>
        <div class="stat-bar"><div class="stat-fill cult-fill" id="bar-exp"></div></div>
      </div>
      <div class="stat-row cult-row">
        <span class="stat-label cult-label">体力</span>
        <div class="stat-bar"><div class="stat-fill cult-stamina" id="bar-cult-stamina"></div></div>
      </div>
      <div class="stat-row cult-row">
        <span class="stat-label cult-label">心情</span>
        <div class="stat-bar"><div class="stat-fill cult-mood" id="bar-cult-mood"></div></div>
      </div>
      <div class="stat-row cult-row" id="cult-demon-row" hidden>
        <span class="stat-label cult-label">心魔</span>
        <div class="stat-bar"><div class="stat-fill cult-demon" id="bar-cult-demon"></div></div>
      </div>
    </div>

    <!-- 存款增加飘字特效 -->
    <div id="float-gain"></div>

    <!-- 冒泡文字（红线 1/3：只反应不教育，3 秒消失） -->
    <div id="bubble"></div>
  </body>
</html>
