[package]
name = "overworked"
version = "0.1.0"
description = "一只住在屏幕角落的像素打工仔"
authors = ["Wyler"]
edition = "2021"

[lib]
# _lib 后缀避免 Windows 下 bin/lib 名冲突（见 rust-lang/cargo#8519）
name = "overworked_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["time"] }
# 行为感知（红线：只记频率不记内容，见 overworked_behavior_sensing）
rdev = "0.5"
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_SystemInformation"] }
# 本地存档（红线4：零上传，单文件 SQLite）
rusqlite = { version = "0.32", features = ["bundled"] }
